# KalaDoc — Docker Compose example.
#
# Brings up the HTTP API (`kaladoc serve`). All state (SQLite database +
# filesystem storage) lives under /data, backed by the `kaladoc-data`
# named volume.
#
# Required secrets (see src/config/mod.rs):
#   APP_SECRET_KEY    — session-signing key, >= 32 printable ASCII chars,
#                       no whitespace. Generate e.g.:
#                       openssl rand -base64 48 | tr -d '\n' | tr '+/' '-_'
#   APP_DB_USER       — DB user (informational for SQLite; required)
#   APP_DB_PASSWORD   — DB password (informational for SQLite; required)
#
# Useful optional env vars (full list in deploy/README.md):
#   KALADOC_API_ADDR          bind address (image default 0.0.0.0:8080)
#   DB_PATH                   SQLite file path (image default /data/kaladoc.db)
#   KALADOC_STORAGE_DIR       storage root (image default /data/storage)
#   KALADOC_STORAGE_MAX_BYTES optional storage quota in bytes
#   KALADOC_LOG_LEVEL / RUST_LOG   tracing filter (default "info")
#   KALADOC_S3_*              S3-compatible storage backend (see MinIO below)
#   KALADOC_CONFIG            path to a TOML config file

services:
  kaladoc:
    build: .
    image: kaladoc:local
    ports:
      - "8080:8080"
    environment:
      # --- required secrets ---
      APP_SECRET_KEY: "change-me-to-a-long-random-string-at-least-32-chars"
      APP_DB_USER: "kaladoc"
      APP_DB_PASSWORD: "change-me"
      # --- container defaults (already set in the image; shown for clarity) ---
      KALADOC_API_ADDR: "0.0.0.0:8080"
      DB_PATH: "/data/kaladoc.db"
      KALADOC_STORAGE_DIR: "/data/storage"
      KALADOC_LOG_LEVEL: "info"
      RUST_LOG: "info"
    volumes:
      - kaladoc-data:/data
    restart: unless-stopped
    # TCP health check — the slim image ships no curl/wget, and bash's
    # /dev/tcp is enough to prove the API port is accepting connections.
    # For an HTTP-level check use the k8s-style probe against /health.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------
  # Optional: durable job worker.
  # `kaladoc serve` only exposes the HTTP API; background jobs enqueued
  # via the API/CLI are processed by `kaladoc jobs worker`. Run a
  # replica of this service (same image, same /data volume) to drain
  # the queue. Multiple workers are safe — the engine uses DB claims.
  # ------------------------------------------------------------------
  # worker:
  #   image: kaladoc:local
  #   command: ["jobs", "worker"]
  #   environment:
  #     APP_SECRET_KEY: "change-me-to-a-long-random-string-at-least-32-chars"
  #     APP_DB_USER: "kaladoc"
  #     APP_DB_PASSWORD: "change-me"
  #     KALADOC_LOG_LEVEL: "info"
  #     RUST_LOG: "info"
  #   volumes:
  #     - kaladoc-data:/data
  #   restart: unless-stopped

  # ------------------------------------------------------------------
  # Optional: MinIO for the S3 storage backend.
  # When enabled, point the API at it with the KALADOC_S3_* variables
  # (uncomment and add to the `kaladoc` service environment):
  #
  #   KALADOC_S3_ENDPOINT: "http://minio:9000"
  #   KALADOC_S3_BUCKET:   "kaladoc"
  #   KALADOC_S3_REGION:   "us-east-1"
  #   KALADOC_S3_ACCESS_KEY: "minioadmin"
  #   KALADOC_S3_SECRET_KEY: "minioadmin"
  #
  # Note: storage root on local disk (KALADOC_STORAGE_DIR) and the S3
  # backend are separate subsystems — check which one your deployment
  # uses before enabling both.
  # ------------------------------------------------------------------
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/data
  #   restart: unless-stopped

volumes:
  kaladoc-data:
  # minio-data:
