[package]
name = "KalaDoc"
version = "0.1.1"
edition = "2024"

[lib]
name = "kaladoc"
path = "src/lib.rs"

[[bin]]
name = "kaladoc"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
directories = "5"
dotenvy = "0.15"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
hex = "0.4"
lopdf = "0.47.0"
rand_core = { version = "0.6", features = ["getrandom"] }
rmcp = { version = "=3.8.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "=1.2.3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
