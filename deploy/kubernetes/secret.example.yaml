# Example Secret for KalaDoc. DO NOT commit real credentials.
#
# Create the real secret out-of-band, e.g.:
#
#   kubectl -n kaladoc create secret generic kaladoc-secrets \
#     --from-literal=APP_SECRET_KEY="$(openssl rand -base64 48 | tr -d '\n')" \
#     --from-literal=APP_DB_USER="kaladoc" \
#     --from-literal=APP_DB_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
#
# APP_SECRET_KEY must be >= 32 printable ASCII characters with no
# whitespace (enforced by AppConfig::validate). Rotate it only with a
# plan — it signs sessions.
apiVersion: v1
kind: Secret
metadata:
  name: kaladoc-secrets
  namespace: kaladoc
type: Opaque
stringData:
  APP_SECRET_KEY: "REPLACE-ME-with-at-least-32-printable-ascii-chars"
  APP_DB_USER: "kaladoc"
  APP_DB_PASSWORD: "REPLACE-ME"
